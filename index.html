<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B2C">
<meta name="description" content="Build a kettlebell workout, see how each move is done, and track your rounds.">
<title>KB Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6B2C'/%3E%3Crect x='7' y='3' width='10' height='8' rx='4' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='12' cy='15.5' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <header class="header">
    <a class="brand" href="index.html">
      <span class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="7" y="2.5" width="10" height="8.5" rx="4.2" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="15.5" r="6.3" fill="#fff"/></svg>
      </span>
      <span class="brand-text">KB Builder</span>
    </a>
    <nav class="nav">
      <a href="index.html" class="active">Workout</a>
      <a href="library.html">Library</a>
    </nav>
  </header>

  <section class="panel">
    <div class="panel-heading"><h2 class="panel-title">Build Your Session</h2></div>
    <div class="panel-body">
      <div class="control-label">Equipment</div>
      <div class="chip-row" id="equipment-row"></div>
      <div class="control-label">Level <small>· choose one or more</small></div>
      <div class="chip-row" id="level-row"></div>
      <div class="control-label">Categories <small>· choose one or more</small></div>
      <div class="chip-row" id="category-row"></div>
      <button class="primary-btn" id="generate-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg>
        Generate Workout
      </button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-heading">
      <h2 class="panel-title">Your Workout</h2>
      <span class="count" id="workout-count"></span>
    </div>
    <div class="ex-list" id="exercise-list"></div>
  </section>

  <section class="panel">
    <div class="panel-heading">
      <h2 class="panel-title">Rounds</h2>
      <div class="target-row" id="target-row" aria-label="Target rounds"></div>
    </div>
    <div class="rt" id="rt-active">
      <button class="rt-count" id="rt-count" aria-label="Undo last round">
        <span class="rt-num" id="rt-num">0</span><span class="rt-of" id="rt-of">/ 4</span>
      </button>
      <div class="rt-label">Rounds complete</div>
      <div class="rt-dots" id="rt-dots"></div>
      <button class="rt-undo" id="rt-undo" hidden>Undo last round</button>
      <button class="primary-btn" id="rt-finish-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L20 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="rt-finish-text">Round 1 Finished</span>
      </button>
    </div>
    <div class="rt" id="rt-done" hidden>
      <div class="rt-badge"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L20 7" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="rt-done-label" id="rt-done-label">4 / 4 rounds complete</div>
      <div class="rt-done-sub">Nice work!</div>
      <button class="secondary-btn" id="rt-restart-btn">Do It Again</button>
      <button class="primary-btn" id="rt-new-btn">New Workout</button>
    </div>
  </section>

  <div class="footer">Videos open on YouTube. Your settings are saved on this device.</div>
</div>

<script src="js/exercises.js"></script>
<script src="js/app.js"></script>
</body>
</html>
